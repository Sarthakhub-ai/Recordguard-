services:
  postgres:
    image: postgres:16-alpine
    container_name: recordguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recordguard}
      POSTGRES_USER: ${POSTGRES_USER:-recordguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.validation or the shell}
    ports:
      - "5432:5432"
    volumes:
      - recordguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  recordguard_pgdata:
